name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:docs
      - run: npm audit --audit-level=low
      - run: npm run check:package

  compatibility:
    name: dsh compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-fund
      - run: npm run test:compat

  required:
    name: CI required
    if: always()
    needs: [quality, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all checks
        env:
          QUALITY: ${{ needs.quality.result }}
          COMPATIBILITY: ${{ needs.compatibility.result }}
        run: test "$QUALITY" = success && test "$COMPATIBILITY" = success
