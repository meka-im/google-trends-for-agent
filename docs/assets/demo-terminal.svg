<text x="400" y="27" text-anchor="middle" fill="#64748b" font-size="12">agent shell</text><text x="24" y="70" fill="#a78bfa" opacity="0">$ npx google-trends-for-agent --query pizza --geo US --time &quot;today 3-m&quot; --pretty<animate attributeName="opacity" from="0" to="1" begin="0.40s" dur="0.2s" fill="freeze"/></text><text x="24" y="96" fill="#e2e8f0" opacity="0">{<animate attributeName="opacity" from="0" to="1" begin="0.95s" dur="0.2s" fill="freeze"/></text><text x="24" y="122" fill="#e2e8f0" opacity="0">  &quot;status&quot;: &quot;ok&quot;,<animate attributeName="opacity" from="0" to="1" begin="1.50s" dur="0.2s" fill="freeze"/></text><text x="24" y="148" fill="#e2e8f0" opacity="0">  &quot;data&quot;: { &quot;interestOverTime&quot;: { &quot;timeline&quot;: [ …93 points… ] } },<animate attributeName="opacity" from="0" to="1" begin="2.05s" dur="0.2s" fill="freeze"/></text><text x="24" y="174" fill="#e2e8f0" opacity="0">  &quot;meta&quot;: { &quot;upstreamRequests&quot;: 3, &quot;durationMs&quot;: 2192, &quot;warnings&quot;: [] }<animate attributeName="opacity" from="0" to="1" begin="2.60s" dur="0.2s" fill="freeze"/></text><text x="24" y="200" fill="#e2e8f0" opacity="0">}<animate attributeName="opacity" from="0" to="1" begin="3.15s" dur="0.2s" fill="freeze"/></text><text x="24" y="226" fill="#94a3b8" opacity="0">$ echo $?   # 0 ok · 2 partial · 3 BLOCKED/RATE_LIMITED · 4 bad input<animate attributeName="opacity" from="0" to="1" begin="3.70s" dur="0.2s" fill="freeze"/></text><text x="24" y="252" fill="#22d3ee" opacity="0">0<animate attributeName="opacity" from="0" to="1" begin="4.25s" dur="0.2s" fill="freeze"/></text></svg>